name: Update Fund Database

on:
  schedule:
    # 每天凌晨 2:30 运行（避开交易时间，且持仓数据通常 T+1 披露）
    - cron: '30 2 * * *'
  workflow_dispatch:  # 支持手动触发
    inputs:
      fund_type:
        description: '指定抓取类型 (all/equity/mix/index)'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5小时超时保护
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: data-branch  # 检出数据分支，避免污染主分支
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas sqlite3 requests
        
    - name: Fetch fund data
      env:
        FUND_TYPE: ${{ github.event.inputs.fund_type || 'all' }}
      run: |
        python scripts/fetch_fund_data.py --type $FUND_TYPE --batch-size 50 --delay 1.5
        
    - name: Optimize SQLite
      run: |
        sqlite3 data/funds.db "VACUUM;"
        ls -lh data/
        
    - name: Commit and force push to data-branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Actions"
        
        # 创建orphan分支（如果不存在）或强制更新
        git add data/funds.db data/meta.json
        git commit -m "Update: $(date +'%Y-%m-%d %H:%M') | Funds: $(sqlite3 data/funds.db 'SELECT COUNT(DISTINCT fund_code) FROM holdings;') records" || echo "No changes"
        
        # 强制推送到data-branch分支（不保留历史，避免仓库膨胀）
        git push origin HEAD:data-branch --force
        
    - name: Upload artifact (backup)
      uses: actions/upload-artifact@v3
      with:
        name: fund-db-backup
        path: data/funds.db
        retention-days: 7
