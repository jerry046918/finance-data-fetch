name: Update Fund Database

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      fund_type:
        description: '指定抓取类型 (all/equity/mix/index)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: data-branch
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas
        
    - name: Fetch fund data
      env:
        FUND_TYPE: ${{ github.event.inputs.fund_type || 'all' }}
      run: |
        python scripts/fetch_fund_data.py --type $FUND_TYPE --batch-size 50 --delay 1.5
        
    - name: Optimize SQLite
      run: |
        sqlite3 data/funds.db "VACUUM;"
        ls -lh data/
        
    - name: Commit and force push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Actions"
        
        git add data/funds.db data/meta.json
        git commit -m "Update: $(date +'%Y-%m-%d %H:%M') | Funds: $(sqlite3 data/funds.db 'SELECT COUNT(DISTINCT fund_code) FROM holdings;' 2>/dev/null || echo '0') records" || echo "No changes"
        
        git push origin HEAD:data-branch --force
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fund-db-backup
        path: data/funds.db
        retention-days: 7
        compression-level: 6
        overwrite: true
