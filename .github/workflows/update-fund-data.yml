name: Update Fund Database

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fetch fund data
      run: |
        python scripts/fetch_fund_data.py
        
    - name: Optimize SQLite
      run: |
        sqlite3 data/funds.db "VACUUM;"
        ls -lh data/
        
    - name: Commit and force push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Actions"
        
        git add data/funds.db data/summary.json
        git commit -m "Update: $(date +'%Y-%m-%d %H:%M') | $(sqlite3 data/funds.db 'SELECT COUNT(*) || \" funds\" FROM funds;')" || echo "No changes"
        
        git push origin HEAD:data-branch --force
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fund-db-backup
        path: data/funds.db
        retention-days: 7
        compression-level: 6
        overwrite: true
